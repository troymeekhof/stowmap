name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "design/**", "*.md", "appcast.xml", "Resources/Info.plist"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only the newest push needs a build; older ones in the queue are dropped.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build universal app (ad-hoc signed)
        run: DMG_OUT="$RUNNER_TEMP/Stowmap.dmg" ./build.sh --package
      - name: Self-test (checksums and copy engine)
        run: '"${TMPDIR:-/tmp}/stowmap-build/Stowmap.app/Contents/MacOS/Stowmap" --selftest'
      - name: Upload DMG
        continue-on-error: true   # a GitHub storage hiccup shouldn't mark a good build as failed
        uses: actions/upload-artifact@v4
        with:
          name: Stowmap-dmg
          path: ${{ runner.temp }}/Stowmap.dmg
          retention-days: 14
