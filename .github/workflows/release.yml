name: Release

# Builds the universal app on a Mac runner and publishes a GitHub release with the DMG and zip.
# If the repo secret SPARKLE_PRIVATE_KEY is set (the exported EdDSA key), it also signs the zip and
# adds the version to appcast.xml, so installed copies are offered the update.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.1"
        required: true
      notes:
        description: "What changed"
        required: false
        default: "Bug fixes and improvements."

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
      GH_TOKEN: ${{ github.token }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        run: |
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || { echo "Bad version: $VERSION"; exit 1; }
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "v$VERSION already released"; exit 1; fi
      - name: Set version
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" \
                                  -c "Set :CFBundleVersion $VERSION" Resources/Info.plist
      - name: Build universal app and DMG
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          DMG_OUT="$RUNNER_TEMP/dist/Stowmap.dmg" ./build.sh --package
          ditto -c -k --sequesterRsrc --keepParent "${TMPDIR:-/tmp}/stowmap-build/Stowmap.app" \
            "$RUNNER_TEMP/dist/Stowmap-$VERSION.zip"
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Release $VERSION" || echo "Version unchanged"
          git push origin HEAD:main
      - name: Create GitHub release
        run: |
          gh release create "v$VERSION" --target main --title "Stowmap $VERSION" --notes "$NOTES" \
            "$RUNNER_TEMP/dist/Stowmap-$VERSION.zip" "$RUNNER_TEMP/dist/Stowmap.dmg"
      - name: Sign and publish to the update feed
        if: env.SPARKLE_PRIVATE_KEY != ''
        run: |
          SIG_ATTRS="$(echo "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - "$RUNNER_TEMP/dist/Stowmap-$VERSION.zip")"
          URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION/Stowmap-$VERSION.zip"
          VERSION="$VERSION" NOTES="$NOTES" URL="$URL" SIG_ATTRS="$SIG_ATTRS" python3 - <<'PY'
          import os, html, email.utils
          v, notes, url, sig = (os.environ[k] for k in ("VERSION", "NOTES", "URL", "SIG_ATTRS"))
          item = f"""    <item>
                <title>Version {v}</title>
                <pubDate>{email.utils.formatdate(usegmt=True)}</pubDate>
                <sparkle:version>{v}</sparkle:version>
                <sparkle:shortVersionString>{v}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                <description><![CDATA[<p>{html.escape(notes)}</p>]]></description>
                <enclosure url="{url}" type="application/octet-stream" {sig} />
              </item>
          """
          s = open("appcast.xml").read()
          marker = "    <title>Stowmap</title>\n"
          open("appcast.xml", "w").write(s.replace(marker, marker + item, 1))
          PY
          git add appcast.xml
          git commit -qm "Appcast: $VERSION"
          git push origin HEAD:main
      - name: Note when the update feed was skipped
        if: env.SPARKLE_PRIVATE_KEY == ''
        run: echo "::warning::SPARKLE_PRIVATE_KEY is not set. The release is downloadable, but installed copies will not be offered this version."
